<app-siperil-header title="Reportes de seguridad" [showMenu]="true"></app-siperil-header>

<ion-content>
  <div class="siperil-page">
    <section class="home-banner">
      <p class="home-kicker">Industrias SIPERIL S.A.S.</p>
      <h1>Hola, {{ auth.user()?.name }}</h1>
      <p>Elige el tipo de reporte que vas a registrar.</p>
    </section>

    @if (auth.isAdmin()) {
      <ion-button expand="block" color="dark" class="admin-entry" routerLink="/ingresos">
        Ingresos
      </ion-button>
      <ion-button expand="block" fill="outline" class="admin-entry" routerLink="/admin">
        Panel de administración
      </ion-button>
    }

    <div class="type-grid">
      @for (item of types; track item.type) {
        <a class="type-card" [routerLink]="['/reports/new', item.type]">
          <ion-icon [name]="item.icon"></ion-icon>
          <div>
            <h3>{{ item.label }}</h3>
            <p>Crear un nuevo registro en campo.</p>
          </div>
        </a>
      }
    </div>

    <ion-button expand="block" fill="outline" class="reports-entry" routerLink="/reports">
      Consultar y editar mis reportes
    </ion-button>
  </div>
</ion-content>
